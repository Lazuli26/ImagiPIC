<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>ImagiPIC · Un juego de perspectivas</title>

    <meta name="description" content="De formas a ideas. Adivina imágenes que aparecen poco a poco, crea tu mazo y juega con tus amigos en ImagiPIC." />
    <meta name="theme-color" content="#f2f5fb" />
    <script>
      try {
        var preference = localStorage.getItem('imagipic.theme');
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#131725' : '#f2f5fb';
      } catch (e) {}
    </script>
    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/assets/icon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/assets/icon/imagipic-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/assets/icon/imagipic-apple-180.png" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ImagiPIC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body>
    <div id="root"></div>
  </body>

</html>
