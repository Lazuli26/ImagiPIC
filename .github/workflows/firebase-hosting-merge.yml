name: Deploy to Firebase Hosting on main
'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Let an active production deployment finish before starting another one.
concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  build_and_deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: IonicSource/package-lock.json
      - name: Check Firebase deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMAGIPIC }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT_IMAGIPIC."
            exit 1
          fi
      - name: Install application dependencies
        run: npm ci --prefix IonicSource
      - name: Build application
        run: npm --prefix IonicSource run build
      - name: Deploy to production
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMAGIPIC }}'
          channelId: live
          projectId: imagipic
